# Explicit opt-in: both profiles must be active. No network access is needed.
spring.config.activate.on-profile=dev & seed
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/seed/books.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=true
